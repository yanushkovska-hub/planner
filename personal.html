<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Личный Планер Задач · Дашборд</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 0%, #171d31 0%, #090d16 100%);
      background-color: #090d16;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #f8fafc;
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: rgba(17, 23, 38, 0.88);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 24px 64px -12px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(99, 102, 241, 0.15);
      border-radius: 24px;
      padding: 36px 32px;
      text-align: center;
      animation: fadeIn 0.4s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .lock-badge {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(168, 85, 247, 0.2));
      border: 1px solid rgba(99, 102, 241, 0.35);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 8px 24px -4px rgba(99, 102, 241, 0.3);
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
      color: #ffffff;
    }
    p.subtitle {
      font-size: 13.5px;
      color: #94a3b8;
      margin-bottom: 28px;
      line-height: 1.5;
    }
    .input-group {
      position: relative;
      margin-bottom: 16px;
      text-align: left;
    }
    .input-field {
      width: 100%;
      height: 52px;
      background: rgba(12, 18, 30, 0.85);
      border: 1.5px solid #1e293b;
      border-radius: 14px;
      padding: 0 46px 0 16px;
      font-size: 16px;
      font-family: inherit;
      color: #ffffff;
      outline: none;
      transition: all 0.2s ease;
    }
    .input-field:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
      background: rgba(15, 23, 42, 0.95);
    }
    .toggle-pass {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      font-size: 18px;
      padding: 6px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .toggle-pass:hover {
      color: #94a3b8;
    }
    .remember-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
      font-size: 13.5px;
      color: #cbd5e1;
      cursor: pointer;
      user-select: none;
      text-align: left;
    }
    .remember-row input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #6366f1;
      cursor: pointer;
    }
    .btn-submit {
      width: 100%;
      height: 52px;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      border: none;
      border-radius: 14px;
      color: #ffffff;
      font-size: 15.5px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 8px 24px -4px rgba(99, 102, 241, 0.45);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-submit:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 28px -4px rgba(99, 102, 241, 0.6);
      filter: brightness(1.08);
    }
    .btn-submit:active {
      transform: translateY(0);
    }
    .error-msg {
      display: none;
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      font-size: 13.5px;
      line-height: 1.4;
      animation: shake 0.3s ease;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .auto-load-overlay {
      position: fixed;
      inset: 0;
      background: #090d16;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(99, 102, 241, 0.2);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div id="autoLoadOverlay" class="auto-load-overlay">
    <div class="spinner"></div>
    <div style="font-size: 14px; color: #94a3b8; font-weight: 500;">Загрузка дашборда...</div>
  </div>

  <div class="auth-card" id="authCard" style="display: none;">
    <div class="lock-badge">🔒</div>
    <h1>Личный Планер Задач</h1>
    <p class="subtitle">Вход защищен шифрованием AES-256.<br>Введите пароль для доступа к данным.</p>

    <form id="authForm" onsubmit="handleAuth(event)">
      <div class="input-group">
        <input type="password" id="passInput" class="input-field" placeholder="Введите пароль..." autocomplete="current-password" autofocus required>
        <button type="button" class="toggle-pass" onclick="togglePassVisibility()" title="Показать/скрыть пароль">👁️</button>
      </div>

      <label class="remember-row">
        <input type="checkbox" id="rememberMe" checked>
        <span>Запомнить меня на этом устройстве</span>
      </label>

      <button type="submit" class="btn-submit" id="submitBtn">
        <span>Открыть дашборд</span> ➔
      </button>

      <div class="error-msg" id="errorMsg">Неверный пароль. Попробуйте снова.</div>
    </form>
  </div>

    };

    const STORAGE_KEY = 'damayanti_planner_key';

    function base64ToUint8Array(base64) {
      const binaryString = atob(base64);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      return bytes;
    }

    async function decryptWithPassword(password) {
      const enc = new TextEncoder();
      const salt = base64ToUint8Array(VAULT.salt);
      const iv = base64ToUint8Array(VAULT.iv);
      const ciphertext = base64ToUint8Array(VAULT.ciphertext);

      const keyMaterial = await window.crypto.subtle.importKey(
        'raw',
        enc.encode(password),
        { name: 'PBKDF2' },
        false,
        ['deriveKey']
      );

      const key = await window.crypto.subtle.deriveKey(
        {
          name: 'PBKDF2',
          salt: salt,
          iterations: 100000,
          hash: 'SHA-256'
        },
        keyMaterial,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );

      const decrypted = await window.crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: iv },
        key,
        ciphertext
      );

      return new TextDecoder().decode(decrypted);
    }

    function renderDecrypted(htmlContent) {
      document.open();
      document.write(htmlContent);
      document.close();
    }

    function togglePassVisibility() {
      const inp = document.getElementById('passInput');
      inp.type = inp.type === 'password' ? 'text' : 'password';
    }

    async function handleAuth(e) {
      if (e) e.preventDefault();
      const pass = document.getElementById('passInput').value;
      const remember = document.getElementById('rememberMe').checked;
      const errEl = document.getElementById('errorMsg');
      const submitBtn = document.getElementById('submitBtn');

      errEl.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.innerText = 'Проверка ключа...';

      try {
        const html = await decryptWithPassword(pass);
        if (remember) {
          localStorage.setItem(STORAGE_KEY, pass);
        }
        sessionStorage.setItem(STORAGE_KEY, pass);
        renderDecrypted(html);
      } catch (err) {
        console.error('Decryption failed:', err);
        errEl.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Открыть дашборд</span> ➔';
      }
    }

    // Auto-login if previously remembered on this browser
    window.addEventListener('DOMContentLoaded', async () => {
      const overlay = document.getElementById('autoLoadOverlay');
      const authCard = document.getElementById('authCard');
      const cached = sessionStorage.getItem(STORAGE_KEY) || localStorage.getItem(STORAGE_KEY);

      if (cached) {
        try {
          const html = await decryptWithPassword(cached);
          sessionStorage.setItem(STORAGE_KEY, cached);
          renderDecrypted(html);
          return;
        } catch (err) {
          console.warn('Cached key invalid or expired, resetting:', err);
          sessionStorage.removeItem(STORAGE_KEY);
          localStorage.removeItem(STORAGE_KEY);
        }
      }

      overlay.style.display = 'none';
      authCard.style.display = 'block';
      setTimeout(() => {
        document.getElementById('passInput').focus();
      }, 50);
    });
  </script>
